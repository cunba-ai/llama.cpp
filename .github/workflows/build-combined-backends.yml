name: Build combined backends

# Builds 6 combined-backend deliverables, each combining ONE GPU vendor backend
# with Vulkan in a single binary (GGML_BACKEND_DL=ON). Replaces the oversized
# GitLab AIO build (CUDA+HIP+Vulkan in one archive) with smaller per-vendor
# archives: cuda+vulkan / hip+vulkan / sycl+vulkan, on Windows and Ubuntu.
#
# CUDA+Vulkan must pass; HIP+Vulkan and SYCL+Vulkan are continue-on-error
# (untested upstream: Vulkan sources compiled under ROCm-clang / icpx).
#
# Note: no ccache-clear step. Unlike release.yml (which clears caches for clean
# release runs), we KEEP ccache + toolchain caches across runs so iteration is
# fast. GitHub LRU-evicts old caches under the 10GB repo limit automatically.
#
# Speedups (2026-11): this workflow runs every 2-4 weeks but GitHub evicts
# caches after 7 days without access, so every run started cold (0% ccache
# hits, run 41406693204). Mitigations:
#   - ccache max-size raised from the ccache-action default 500MB to 2G
#   - weekly schedule (below) runs the cache-keepalive-* jobs only: they
#     restore every cache to reset the 7-day eviction timer. NOTE: the touch
#     must live in THIS workflow - probes on 2026-11-02 (run 41425955578)
#     showed a separate workflow cannot restore these caches even by exact
#     key on the same branch, so an external keepalive workflow is useless.
#     Touch jobs run on the same runner type that created each cache
#     (archives are OS-filtered at restore time).
#   - Linux hip/sycl legs run in prebaked GHCR images (see ci-images job)
#   - hip-vulkan-windows: mt.exe (Windows SDK) added to PATH - upstream
#     d63fbfe79 embeds a manifest in every exe and lld-link shells out to
#     mt.exe for it; this job runs without vcvarsall so it was not on PATH
#   - cuda-vulkan-windows: CUDA toolkit dir cached (saves ~7min install)

on:
  workflow_dispatch:
    inputs:
      touch-only:
        description: 'Only run the cache-keepalive touch jobs (no builds)'
        type: boolean
        default: false
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC - cache keepalive only
  push:
    branches:
      - master
    paths: [
      '.github/workflows/build-combined-backends.yml',
      'miaosoft/ci-images/**',
      '**/CMakeLists.txt',
      '**/.cmake',
      '**/*.h',
      '**/*.hpp',
      '**/*.c',
      '**/*.cpp',
      '**/*.cu',
      '**/*.cuh',
      '**/*.comp',
      '**/*.glsl'
    ]

permissions:
  contents: read
  actions: write   # needed to save ccache + toolchain caches
  packages: read   # pull prebaked CI images from GHCR

env:
  GH_TOKEN: ${{ github.token }}
  CMAKE_ARGS: "-DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DGGML_RPC=ON -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF -DLLAMA_OPENSSL=OFF"
  CUDA_ARCHS: "61;70;75;80;86;89;120"
  AMDGPU_TARGETS: "gfx1100;gfx1101;gfx1102;gfx1150;gfx1151;gfx1200;gfx1201"
  VULKAN_VERSION: "1.4.313.2"
  OSS_BUCKET: "miaosoft-internal"
  OSS_ENDPOINT: "oss-cn-shanghai.aliyuncs.com"
  OSS_PREFIX: "cunba.ai/istation/shared/engine-llama"

concurrency:
  group: build-combined-backends
  cancel-in-progress: false

jobs:
  # ============================================================
  #  Cache keepalive - schedule / touch-only dispatch only.
  #  Restores every cache to reset the 7-day eviction timer.
  #  Must live in THIS workflow: caches created here are not
  #  restorable from other workflows even by exact key on the
  #  same branch (probed 2026-11-02, run 41425955578). Touch
  #  jobs use the same runner type that created each cache
  #  (archives are OS-filtered at restore time). Every step is
  #  continue-on-error so one flaky download cannot abort the
  #  remaining refreshes.
  # ============================================================
  cache-keepalive-win:
    if: github.event_name == 'schedule' || inputs.touch-only == true
    runs-on: windows-2022
    steps:
      # checkout present: every restore that ever HIT ran in a job with a
      # checkout; every restore that MISSED ran without one (probed
      # 2026-11-02). Not explained by docs, but cheap to satisfy.
      - name: Clone
        uses: actions/checkout@v6

      - name: ccache combined-windows-2022-cuda-12.9
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: cache-touch
          key: keepalive-${{ github.run_id }}
          restore-keys: ccache-combined-windows-2022-cuda-12.9-

      - name: ccache combined-windows-2022-hip
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: cache-touch
          key: keepalive-${{ github.run_id }}
          restore-keys: ccache-combined-windows-2022-hip-

      - name: ccache combined-windows-2022-sycl
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: cache-touch
          key: keepalive-${{ github.run_id }}
          restore-keys: ccache-combined-windows-2022-sycl-

      - name: vulkan-sdk
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: cache-touch
          key: vulkan-sdk-1.4.313.2-v1

      - name: cuda-toolkit
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: cache-touch
          key: cuda-toolkit-12.9.0-windows-v1

  cache-keepalive-u22:
    if: github.event_name == 'schedule' || inputs.touch-only == true
    runs-on: ubuntu-22.04
    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: ccache combined-ubuntu-22.04-cuda-12.9
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: cache-touch
          key: keepalive-${{ github.run_id }}
          restore-keys: ccache-combined-ubuntu-22.04-cuda-12.9-

      - name: ccache combined-ubuntu-22.04-hip
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: cache-touch
          key: keepalive-${{ github.run_id }}
          restore-keys: ccache-combined-ubuntu-22.04-hip-

  cache-keepalive-u24:
    if: github.event_name == 'schedule' || inputs.touch-only == true
    runs-on: ubuntu-24.04
    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: ccache combined-ubuntu-24.04-sycl
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: cache-touch
          key: keepalive-${{ github.run_id }}
          restore-keys: ccache-combined-ubuntu-24.04-sycl-

  # ============================================================
  #  CI images (GHCR) - bake the Linux legs' runtime installs
  #  (ROCm+Vulkan, oneAPI+Vulkan) into images so jobs start at
  #  configure. Content-hash gated: rebuilds only when the
  #  Dockerfile changes, otherwise the job is a ~1min no-op.
  # ============================================================
  ci-images:
    if: github.event_name != 'schedule' && inputs.touch-only != true
    # continue-on-error: a failure here must not cascade into skipping the
    # hip/sycl legs (needs) and through them the publish jobs - the legs
    # would then fail on the missing image and that is enough signal.
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hip-vulkan-ubuntu
          - name: sycl-vulkan-ubuntu
    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build & push (if Dockerfile changed)
        run: |
          set -e
          IMG="ghcr.io/${{ github.repository_owner }}/llm-ci-${{ matrix.name }}"
          TAG="$(sha256sum "miaosoft/ci-images/${{ matrix.name }}.Dockerfile" | cut -c1-16)"
          if docker manifest inspect "$IMG:$TAG" >/dev/null 2>&1; then
            echo "Image $IMG:$TAG already in registry - skipping build"
            exit 0
          fi
          echo "Building $IMG:$TAG (Dockerfile changed or first run)"
          # Pull the previous image as build cache so unchanged heavy layers
          # (Vulkan/ROCm/oneAPI) are reused instead of rebuilt.
          docker pull -q "$IMG:latest" 2>/dev/null || true
          docker build \
            --cache-from "$IMG:latest" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t "$IMG:$TAG" -t "$IMG:latest" \
            -f "miaosoft/ci-images/${{ matrix.name }}.Dockerfile" .
          docker push "$IMG:$TAG"
          docker push "$IMG:latest"

  # ============================================================
  #  CUDA 12.9 + Vulkan
  # ============================================================
  cuda-vulkan-windows:
    if: github.event_name != 'schedule' && inputs.touch-only != true
    runs-on: windows-2022
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache CUDA Toolkit
        id: cache-cuda
        uses: actions/cache@v5
        with:
          path: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9
          key: cuda-toolkit-12.9.0-windows-v1

      - name: Setup CUDA Toolkit 12.9
        if: steps.cache-cuda.outputs.cache-hit != 'true'
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.9.0'
          method: 'network'
          use-github-cache: false   # cached explicitly above (stable key)

      - name: Configure CUDA env (cached toolkit)
        if: steps.cache-cuda.outputs.cache-hit == 'true'
        run: |
          $cuda = 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9'
          Add-Content $env:GITHUB_ENV "CUDA_PATH=$cuda"
          Add-Content $env:GITHUB_PATH "$cuda\bin"

      - name: Cache Vulkan SDK
        id: cache-vulkan
        uses: actions/cache@v5
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_VERSION }}
          key: vulkan-sdk-${{ env.VULKAN_VERSION }}-v1

      - name: Install Vulkan SDK
        if: steps.cache-vulkan.outputs.cache-hit != 'true'
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install

      - name: Configure Vulkan env
        run: |
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"

      - name: Install Ninja
        run: choco install ninja

      - name: Compute version
        shell: bash
        run: |
          echo "BUILD_NUMBER=$(date -u +%y%m%d)"        >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y%m%d)"          >> "$GITHUB_ENV"
          echo "COMMIT_ID_SHORT=${GITHUB_SHA:0:8}"      >> "$GITHUB_ENV"

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: combined-windows-2022-cuda-12.9
          max-size: 2G

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_BACKEND_DL=ON ^
            -DBUILD_SHARED_LIBS=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CUDA=ON ^
            -DGGML_VULKAN=ON ^
            -DGGML_CUDA_CUB_3DOT2=ON ^
            -DCMAKE_CUDA_ARCHITECTURES="${{ env.CUDA_ARCHS }}" ^
            -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache ^
            -DLLAMA_BUILD_NUMBER=%BUILD_NUMBER% ^
            -DLLAMA_BUILD_COMMIT=%COMMIT_ID_SHORT% ^
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release -j %NUMBER_OF_PROCESSORS% --target llama-cli llama-server ggml-rpc-server

      - name: Bundle CUDA runtime DLLs
        run: |
          $dst='.\build\bin\Release'
          robocopy "${{ env.CUDA_PATH }}\bin" $dst cudart64_*.dll cublas64_*.dll cublasLt64_*.dll nvrtc64_*.dll nvJitLink_*.dll nvtx64_*.dll
          # robocopy returns non-zero on success (codes <8); reset so the step does not fail
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed with code $LASTEXITCODE" } else { $global:LASTEXITCODE = 0 }

      - name: Bundle MSVC runtime DLLs
        # Ship the VC++ runtime next to the exes (exe dir is searched before
        # System32) so a stale/corrupt system MSVCP140.dll can't crash them.
        run: |
          $dst='.\build\bin\Release'
          $crt=(Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1)
          if (-not $crt) { $crt=Get-Item 'C:\Windows\System32' }
          Copy-Item "$($crt.FullName)\MSVCP140.dll","$($crt.FullName)\VCRUNTIME140.dll","$($crt.FullName)\VCRUNTIME140_1.dll" $dst -Force
          Get-ChildItem "$dst\MSVCP140.dll","$dst\VCRUNTIME140.dll","$dst\VCRUNTIME140_1.dll" | Format-Table Name,Length,@{n='Ver';e={$_.VersionInfo.FileVersion}}

      - name: Pack artifacts
        shell: bash
        run: |
          printf '%s-%s' "$BUILD_DATE" "$COMMIT_ID_SHORT" > ./build/bin/Release/VERSION
          cp miaosoft/scripts/install/install.bat ./build/bin/Release/install.bat
          cp LICENSE ./build/bin/Release/
          7z a -snl llama-cuda-vulkan-windows-x64.zip ./build/bin/Release/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          path: llama-cuda-vulkan-windows-x64.zip
          name: llama-cuda-vulkan-windows-x64.zip

  cuda-vulkan-ubuntu:
    if: github.event_name != 'schedule' && inputs.touch-only != true
    runs-on: ubuntu-22.04
    container:
      image: nvidia/cuda:12.9.1-devel-ubuntu22.04
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Dependencies
        run: |
          apt-get update -y
          apt-get install -y build-essential libssl-dev ninja-build cmake pkg-config git wget gnupg ca-certificates p7zip-full
          # glslc is not in stock Ubuntu 22.04; pull it from the LunarG Vulkan SDK repo
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | apt-key add -
          wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          apt-get update -y
          apt-get install -y vulkan-sdk

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: combined-ubuntu-22.04-cuda-12.9
          max-size: 2G

      - name: Compute version
        shell: bash
        run: |
          echo "BUILD_NUMBER=$(date -u +%y%m%d)"     >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y%m%d)"       >> "$GITHUB_ENV"
          echo "COMMIT_ID_SHORT=${GITHUB_SHA:0:8}"   >> "$GITHUB_ENV"

      - name: Build
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_BACKEND_DL=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CUDA=ON \
            -DGGML_VULKAN=ON \
            -DGGML_CUDA_CUB_3DOT2=ON \
            -DGGML_CUDA_NCCL=OFF \
            -DCMAKE_CUDA_ARCHITECTURES="${{ env.CUDA_ARCHS }}" \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache \
            -DLLAMA_BUILD_NUMBER="$BUILD_NUMBER" \
            -DLLAMA_BUILD_COMMIT="$COMMIT_ID_SHORT" \
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release -j $(nproc) --target llama-cli llama-server ggml-rpc-server

      - name: Bundle CUDA runtime
        run: |
          cp -P /usr/local/cuda/lib64/libcudart.so* build/bin/ 2>/dev/null || true
          cp -P /usr/local/cuda/lib64/libcublas.so* build/bin/ 2>/dev/null || true
          cp -P /usr/local/cuda/lib64/libcublasLt.so* build/bin/ 2>/dev/null || true
          cp -P /usr/local/cuda/lib64/libnvrtc.so* build/bin/ 2>/dev/null || true
          cp -P /usr/local/cuda/lib64/libnvJitLink.so* build/bin/ 2>/dev/null || true

      - name: Pack artifacts
        run: |
          echo "$BUILD_DATE-$COMMIT_ID_SHORT" > build/bin/VERSION
          cp miaosoft/scripts/install/install.sh build/bin/
          cp LICENSE build/bin/
          7z a -snl llama-cuda-vulkan-ubuntu-x64.zip ./build/bin/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          path: llama-cuda-vulkan-ubuntu-x64.zip
          name: llama-cuda-vulkan-ubuntu-x64.zip

  # ============================================================
  #  ROCm/HIP + Vulkan  (non-blocking)
  # ============================================================
  hip-vulkan-windows:
    if: github.event_name != 'schedule' && inputs.touch-only != true
    continue-on-error: true
    runs-on: windows-2022
    env:
      ROCM_VERSION: "10.0.0"
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ROCm 10 retired the old HIP SDK exe installer; Windows now uses the
      # TheRock wheels (same route as upstream's release.yml windows-rocm job).
      - name: Cache ROCm Installation
        id: cache-rocm
        uses: actions/cache@v5
        with:
          path: C:\TheRock\build
          key: rocm-wheels-${{ env.ROCM_VERSION }}-devices-${{ runner.os }}

      - name: Setup ROCm
        if: steps.cache-rocm.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -Path "C:\TheRock\build" -ItemType Directory -Force | Out-Null
          python -m venv C:\TheRock\build\.venv
          & C:\TheRock\build\.venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          # rocm[libraries,devel] ships no GPU kernels; each rocm-sdk-device-*
          # wheel adds the rocBLAS/hipBLASLt Tensile kernels for one gfx arch
          # (the windows-setup-rocm action cannot express these extras)
          $pkgs = @("rocm[libraries,devel]==${{ env.ROCM_VERSION }}")
          $pkgs += ('${{ env.AMDGPU_TARGETS }}' -split ';' | ForEach-Object { "rocm-sdk-device-$_==${{ env.ROCM_VERSION }}" })
          python -m pip install --index-url https://stable.repo.amd.com/rocm/whl-next/ @pkgs

      - name: Setup ROCm Environment
        run: |
          $ErrorActionPreference = "Stop"
          & C:\TheRock\build\.venv\Scripts\Activate.ps1
          rocm-sdk init # idempotent; no-op if already expanded
          if ($LASTEXITCODE -ne 0) { throw "rocm-sdk init failed with exit code $LASTEXITCODE" }
          $rocmPath = (rocm-sdk path --root).Trim()
          $cmakePath = (rocm-sdk path --cmake).Trim()
          $binPath = (rocm-sdk path --bin).Trim()
          if (-not $rocmPath) { throw "rocm-sdk path --root returned empty - devel package may not be installed" }
          write-host "ROCm root: $rocmPath"
          echo "HIP_PATH=$rocmPath" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$cmakePath" >> $env:GITHUB_ENV
          echo "HIP_DEVICE_LIB_PATH=$rocmPath\lib\llvm\amdgcn\bitcode" >> $env:GITHUB_ENV
          echo "HIP_PLATFORM=amd" >> $env:GITHUB_ENV
          echo "LLVM_PATH=$rocmPath\lib\llvm" >> $env:GITHUB_ENV
          echo "$binPath" >> $env:GITHUB_PATH
          # keep the venv on PATH so later steps can call rocm-sdk
          echo "C:\TheRock\build\.venv\Scripts" >> $env:GITHUB_PATH

      - name: Cache Vulkan SDK
        id: cache-vulkan
        uses: actions/cache@v5
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_VERSION }}
          key: vulkan-sdk-${{ env.VULKAN_VERSION }}-v1

      - name: Install Vulkan SDK
        if: steps.cache-vulkan.outputs.cache-hit != 'true'
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install

      - name: Configure Vulkan env
        run: |
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"

      - name: Install Ninja
        run: choco install ninja

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: combined-windows-2022-hip
          max-size: 2G

      - name: Tune ccache for ROCm
        run: |
          # required from ROCm 10.1 (clang -E output has no GPU code, so the
          # preprocessor fallback can reuse objects with old GPU code); safe on
          # 10.0 too - matches upstream's windows-rocm job
          ccache --set-config=depend_mode=true

      - name: Compute version
        shell: bash
        run: |
          echo "BUILD_NUMBER=$(date -u +%y%m%d)"        >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y%m%d)"          >> "$GITHUB_ENV"
          echo "COMMIT_ID_SHORT=${GITHUB_SHA:0:8}"      >> "$GITHUB_ENV"

      - name: Build
        run: |
          # Upstream d63fbfe79 embeds a manifest into every Windows exe; lld-link
          # implements that by shelling out to mt.exe. This job deliberately runs
          # without vcvarsall (see comment below), so put the Windows SDK bin dir
          # (mt.exe/rc.exe) on PATH ourselves.
          $sdkBin = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\mt.exe' |
                     Sort-Object FullName -Descending | Select-Object -First 1).DirectoryName
          if (-not $sdkBin) { Write-Error "mt.exe not found under Windows Kits"; exit 1 }
          $env:PATH = "$sdkBin;$env:PATH"
          # vulkan-shaders-gen is built by a CMake ExternalProject that re-detects its
          # own compiler (it does not inherit the -DCMAKE_C/CXX_COMPILER passed to the
          # parent, and CMAKE_CROSSCOMPILING is false on Windows-HIP). On the windows-2022
          # image (no vcvarsall here) that detection is non-deterministic and the resulting
          # .exe can end up tied to a runtime DLL not on PATH, so gmake fails to launch it
          # with a silent "Error 127" when generating shaders. Pin the host tool onto the
          # ROCm clang and put its runtime DLLs on PATH so the .exe actually loads.
          $env:CC  = "${env:HIP_PATH}\lib\llvm\bin\clang.exe"
          $env:CXX = "${env:HIP_PATH}\lib\llvm\bin\clang++.exe"
          $env:PATH = "${env:HIP_PATH}\lib\llvm\bin;" + $env:PATH
          cmake -G "Unix Makefiles" -B build -S . `
            -DCMAKE_C_COMPILER="${env:HIP_PATH}\lib\llvm\bin\clang.exe" `
            -DCMAKE_CXX_COMPILER="${env:HIP_PATH}\lib\llvm\bin\clang++.exe" `
            -DCMAKE_HIP_COMPILER="${env:HIP_PATH}\lib\llvm\bin\clang.exe" `
            -DCMAKE_CXX_FLAGS="-Wno-ignored-attributes -Wno-nested-anon-types" `
            -DCMAKE_BUILD_TYPE=Release `
            -DGGML_BACKEND_DL=ON `
            -DBUILD_SHARED_LIBS=ON `
            -DGGML_NATIVE=OFF `
            -DGPU_TARGETS="${{ env.AMDGPU_TARGETS }}" `
            -DGGML_HIP=ON `
            -DCMAKE_HIP_COMPILER_LAUNCHER=ccache `
            -DGGML_VULKAN=ON `
            -DLLAMA_BUILD_NUMBER="$env:BUILD_NUMBER" `
            -DLLAMA_BUILD_COMMIT="$env:COMMIT_ID_SHORT" `
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release -j ${env:NUMBER_OF_PROCESSORS} --target llama-cli llama-server ggml-rpc-server

      - name: Bundle ROCm runtime DLLs
        run: |
          $src=(rocm-sdk path --bin).Trim()
          if (-not $src) { throw "rocm-sdk path --bin returned empty" }
          $dst='.\build\bin'
          # TheRock names the HIP BLAS dll hipblas.dll (ggml-hip.dll imports it
          # directly); libhipblas.dll only existed in the old HIP SDK layout.
          # origami.dll: new dep of libhipblaslt (rocblas -> hipblaslt -> origami)
          foreach ($p in @('amdhip64_*.dll','rocm_kpack*.dll','amd_comgr*.dll','hiprtc*.dll','hipblas.dll','libhipblas.dll','libhipblaslt.dll','origami.dll','rocblas.dll','rocsolver.dll')) {
            Copy-Item "$src\$p" $dst -Force -ErrorAction SilentlyContinue
          }
          # Tensile kernels from the device wheels live under
          # bin\{rocblas,hipblaslt}\library\<gfx>\; robocopy /E recurses
          robocopy "$src\rocblas\library" "$dst\rocblas\library" /E /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -ge 8) { throw "robocopy rocblas failed: $LASTEXITCODE" } else { $global:LASTEXITCODE = 0 }
          robocopy "$src\hipblaslt\library" "$dst\hipblaslt\library" /E /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -ge 8) { throw "robocopy hipblaslt failed: $LASTEXITCODE" } else { $global:LASTEXITCODE = 0 }
          # fail loudly instead of shipping an archive that cannot run
          foreach ($dll in @('amdhip64_7.dll','rocm_kpack.dll','hipblas.dll','rocblas.dll','libhipblaslt.dll','origami.dll')) {
            if (-not (Test-Path "$dst\$dll")) { Write-Error "missing $dll"; exit 1 }
          }
          # device wheels package kernels two ways: flat *_<gfx>.* files for
          # some archs, library\<gfx>\ subdirs for others - accept either
          foreach ($t in ('${{ env.AMDGPU_TARGETS }}' -split ';')) {
            $has = (Test-Path "$dst\rocblas\library\$t") -or [bool](Get-ChildItem "$dst\rocblas\library" -Filter "*_$t.*" -ErrorAction SilentlyContinue)
            if (-not $has) { Write-Error "missing rocblas kernels for $t"; exit 1 }
          }

      - name: Bundle MSVC runtime DLLs
        # Ship the VC++ runtime next to the exes (exe dir is searched before
        # System32) so a stale/corrupt system MSVCP140.dll can't crash them.
        run: |
          $dst='.\build\bin'
          $crt=(Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1)
          if (-not $crt) { $crt=Get-Item 'C:\Windows\System32' }
          Copy-Item "$($crt.FullName)\MSVCP140.dll","$($crt.FullName)\VCRUNTIME140.dll","$($crt.FullName)\VCRUNTIME140_1.dll" $dst -Force
          Get-ChildItem "$dst\MSVCP140.dll","$dst\VCRUNTIME140.dll","$dst\VCRUNTIME140_1.dll" | Format-Table Name,Length,@{n='Ver';e={$_.VersionInfo.FileVersion}}

      - name: Pack artifacts
        shell: bash
        run: |
          printf '%s-%s' "$BUILD_DATE" "$COMMIT_ID_SHORT" > ./build/bin/VERSION
          cp miaosoft/scripts/install/install.bat ./build/bin/install.bat
          cp LICENSE ./build/bin/
          7z a -snl llama-hip-vulkan-windows-x64.zip ./build/bin/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          path: llama-hip-vulkan-windows-x64.zip
          name: llama-hip-vulkan-windows-x64.zip

  hip-vulkan-ubuntu:
    if: github.event_name != 'schedule' && inputs.touch-only != true
    continue-on-error: true
    needs: [ci-images]
    runs-on: ubuntu-22.04
    container:
      # Prebaked by the ci-images job: ROCm 10.0 (TheRock wheels) + Vulkan SDK
      # 1.4.313 + build tools (see miaosoft/ci-images/hip-vulkan-ubuntu.Dockerfile)
      image: ghcr.io/cunba-ai/llm-ci-hip-vulkan-ubuntu:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: combined-ubuntu-22.04-hip
          max-size: 2G

      - name: Tune ccache for ROCm
        run: |
          # required from ROCm 10.1 (clang -E output has no GPU code, so the
          # preprocessor fallback can reuse objects with old GPU code); safe on
          # 10.0 too - matches upstream's windows-rocm job
          ccache --set-config=depend_mode=true

      - name: Compute version
        shell: bash
        run: |
          echo "BUILD_NUMBER=$(date -u +%y%m%d)"     >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y%m%d)"       >> "$GITHUB_ENV"
          echo "COMMIT_ID_SHORT=${GITHUB_SHA:0:8}"   >> "$GITHUB_ENV"

      - name: Build
        run: |
          ROCM_ROOT="$(rocm-sdk path --root)"
          cmake -B build -S . \
            -DCMAKE_HIP_COMPILER="$ROCM_ROOT/lib/llvm/bin/clang" \
            -DCMAKE_PREFIX_PATH="$ROCM_ROOT" \
            -DHIP_PATH="$ROCM_ROOT" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_BACKEND_DL=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_NATIVE=OFF \
            -DGPU_TARGETS="${{ env.AMDGPU_TARGETS }}" \
            -DHIP_PLATFORM=amd \
            -DGGML_HIP=ON \
            -DCMAKE_HIP_COMPILER_LAUNCHER=ccache \
            -DGGML_VULKAN=ON \
            -DLLAMA_BUILD_NUMBER="$BUILD_NUMBER" \
            -DLLAMA_BUILD_COMMIT="$COMMIT_ID_SHORT" \
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release -j $(nproc) --target llama-cli llama-server ggml-rpc-server

      - name: Bundle ROCm runtime
        run: |
          ROCM_ROOT="$(rocm-sdk path --root)"
          # the transitive closure ggml-hip needs at load time: hip runtime +
          # blas stack + comgr/hsa/kpack/roctx/rocroller from the core wheel,
          # plus libclang-cpp/libLLVM that comgr links dynamically
          for lib in libamdhip64 libhipblas libhipblaslt librocblas librocsolver librocblas-util libTensile liborigami librocsparse libamd_comgr libhsa-runtime64 librocm_kpack librocm_sysdeps_z librocprofiler-register librocroller libroctx64 libclang-cpp libLLVM; do
            cp -P "$ROCM_ROOT"/lib/${lib}.so* build/bin/ 2>/dev/null || true
          done
          # nested in the TheRock layout
          cp -P "$ROCM_ROOT"/lib/rocm_sysdeps/lib/*.so* build/bin/ 2>/dev/null || true
          # Tensile kernels from the device wheels live under
          # {lib,bin}/<lib>/library/<gfx>/ depending on the dist layout
          mkdir -p build/bin/rocblas/library build/bin/hipblaslt/library
          for tree in rocblas hipblaslt; do
            for d in "$ROCM_ROOT/lib/$tree/library" "$ROCM_ROOT/bin/$tree/library"; do
              [ -d "$d" ] && cp -Pr "$d"/. "build/bin/$tree/library/" && break
            done
          done
          # fail loudly instead of shipping an archive without kernels;
          # wheels package kernels flat (*_<gfx>.*) or in <gfx>/ subdirs
          for t in $(echo "${{ env.AMDGPU_TARGETS }}" | tr ';' ' '); do
            if [ ! -d "build/bin/rocblas/library/$t" ] \
               && ! ls build/bin/rocblas/library/*_"$t".* >/dev/null 2>&1; then
              echo "missing rocblas kernels for $t"; exit 1
            fi
          done
          # full dependency closure check against the bundled tree itself
          missing=$(LD_LIBRARY_PATH="$PWD/build/bin" ldd build/bin/libggml-hip.so 2>/dev/null | grep "not found" || true)
          if [ -n "$missing" ]; then echo "unresolved deps:"; echo "$missing"; exit 1; fi

      - name: Pack artifacts
        run: |
          echo "$BUILD_DATE-$COMMIT_ID_SHORT" > build/bin/VERSION
          cp miaosoft/scripts/install/install.sh build/bin/
          cp LICENSE build/bin/
          # zip -y stores symlinks as links; 7z -snl in this container writes
          # them as 17-22 byte plain text files that no extractor restores
          (cd build/bin && zip -r -y ../../llama-hip-vulkan-ubuntu-x64.zip .)

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          path: llama-hip-vulkan-ubuntu-x64.zip
          name: llama-hip-vulkan-ubuntu-x64.zip

  # ============================================================
  #  SYCL + Vulkan  (non-blocking)
  # ============================================================
  sycl-vulkan-windows:
    if: github.event_name != 'schedule' && inputs.touch-only != true
    continue-on-error: true
    runs-on: windows-2022
    env:
      WINDOWS_BASEKIT_URL: https://registrationcenter-download.intel.com/akdlm/IRC_NAS/b60765d1-2b85-4e85-86b6-cb0e9563a699/intel-deep-learning-essentials-2025.3.3.18_offline.exe
      WINDOWS_DPCPP_MKL: intel.oneapi.win.cpp-dpcpp-common:intel.oneapi.win.mkl.devel:intel.oneapi.win.dnnl:intel.oneapi.win.tbb.devel
      LEVEL_ZERO_SDK_URL: https://github.com/oneapi-src/level-zero/releases/download/v1.28.2/level-zero-win-sdk-1.28.2.zip
      ONEAPI_ROOT: "C:/Program Files (x86)/Intel/oneAPI"
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download & Install oneAPI
        shell: bash
        run: |
          scripts/install-oneapi.bat $WINDOWS_BASEKIT_URL $WINDOWS_DPCPP_MKL

      - name: Install Level Zero SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "${{ env.LEVEL_ZERO_SDK_URL }}" -OutFile "level-zero-win-sdk.zip"
          Expand-Archive -Path "level-zero-win-sdk.zip" -DestinationPath "C:/level-zero-sdk" -Force
          "LEVEL_ZERO_V1_SDK_PATH=C:/level-zero-sdk" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache Vulkan SDK
        id: cache-vulkan
        uses: actions/cache@v5
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_VERSION }}
          key: vulkan-sdk-${{ env.VULKAN_VERSION }}-v1

      - name: Install Vulkan SDK
        if: steps.cache-vulkan.outputs.cache-hit != 'true'
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install

      - name: Configure Vulkan env
        run: |
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"

      - name: Install Ninja
        run: choco install ninja

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: combined-windows-2022-sycl
          max-size: 2G

      - name: Compute version
        shell: bash
        run: |
          echo "BUILD_NUMBER=$(date -u +%y%m%d)"        >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y%m%d)"          >> "$GITHUB_ENV"
          echo "COMMIT_ID_SHORT=${GITHUB_SHA:0:8}"      >> "$GITHUB_ENV"

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat" intel64 --force
          cmake -G "Ninja" -B build ^
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=icx ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_C_COMPILER_LAUNCHER=ccache ^
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ^
            -DGGML_BACKEND_DL=ON -DBUILD_SHARED_LIBS=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_SYCL=ON -DGGML_SYCL_F16=OFF ^
            -DGGML_VULKAN=ON ^
            -DLLAMA_BUILD_NUMBER=%BUILD_NUMBER% ^
            -DLLAMA_BUILD_COMMIT=%COMMIT_ID_SHORT% ^
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release -j %NUMBER_OF_PROCESSORS% --target llama-cli llama-server ggml-rpc-server

      - name: Bundle oneAPI runtime DLLs
        shell: bash
        run: |
          cp "${{ env.ONEAPI_ROOT }}/mkl/latest/bin/mkl_sycl_blas.5.dll" ./build/bin 2>/dev/null || true
          cp "${{ env.ONEAPI_ROOT }}/mkl/latest/bin/mkl_core.2.dll" ./build/bin 2>/dev/null || true
          cp "${{ env.ONEAPI_ROOT }}/mkl/latest/bin/mkl_tbb_thread.2.dll" ./build/bin 2>/dev/null || true
          cp "${{ env.ONEAPI_ROOT }}/compiler/latest/bin/ur_adapter_level_zero.dll" ./build/bin 2>/dev/null || true
          cp "${{ env.ONEAPI_ROOT }}/compiler/latest/bin/ur_adapter_level_zero_v2.dll" ./build/bin 2>/dev/null || true
          cp "${{ env.ONEAPI_ROOT }}/compiler/latest/bin/ur_adapter_opencl.dll" ./build/bin 2>/dev/null || true
          cp "${{ env.ONEAPI_ROOT }}/compiler/latest/bin/ur_loader.dll" ./build/bin 2>/dev/null || true
          cp "${{ env.ONEAPI_ROOT }}/compiler/latest/bin/ur_win_proxy_loader.dll" ./build/bin 2>/dev/null || true
          ZE_LOADER_DLL=$(find "${{ env.ONEAPI_ROOT }}" "$LEVEL_ZERO_V1_SDK_PATH" -iname ze_loader.dll -print -quit 2>/dev/null || true)
          [ -n "$ZE_LOADER_DLL" ] && cp "$ZE_LOADER_DLL" ./build/bin
          cp "${{ env.ONEAPI_ROOT }}/compiler/latest/bin/sycl8.dll" ./build/bin 2>/dev/null || true
          cp "${{ env.ONEAPI_ROOT }}/compiler/latest/bin/svml_dispmd.dll" ./build/bin 2>/dev/null || true
          cp "${{ env.ONEAPI_ROOT }}/compiler/latest/bin/libmmd.dll" ./build/bin 2>/dev/null || true
          cp "${{ env.ONEAPI_ROOT }}/compiler/latest/bin/libiomp5md.dll" ./build/bin 2>/dev/null || true
          cp "${{ env.ONEAPI_ROOT }}/dnnl/latest/bin/dnnl.dll" ./build/bin 2>/dev/null || true
          cp "${{ env.ONEAPI_ROOT }}/tbb/latest/bin/tbb12.dll" ./build/bin 2>/dev/null || true

      - name: Bundle MSVC runtime DLLs
        # Ship the VC++ runtime next to the exes (exe dir is searched before
        # System32) so a stale/corrupt system MSVCP140.dll can't crash them.
        run: |
          $dst='.\build\bin'
          $crt=(Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1)
          if (-not $crt) { $crt=Get-Item 'C:\Windows\System32' }
          Copy-Item "$($crt.FullName)\MSVCP140.dll","$($crt.FullName)\VCRUNTIME140.dll","$($crt.FullName)\VCRUNTIME140_1.dll" $dst -Force
          Get-ChildItem "$dst\MSVCP140.dll","$dst\VCRUNTIME140.dll","$dst\VCRUNTIME140_1.dll" | Format-Table Name,Length,@{n='Ver';e={$_.VersionInfo.FileVersion}}

      - name: Pack artifacts
        shell: bash
        run: |
          printf '%s-%s' "$BUILD_DATE" "$COMMIT_ID_SHORT" > ./build/bin/VERSION
          cp miaosoft/scripts/install/install.bat ./build/bin/install.bat
          cp LICENSE ./build/bin/
          # build/bin holds the exes + dlls (Ninja single-config puts outputs in build/bin)
          7z a -snl llama-sycl-vulkan-windows-x64.zip ./build/bin/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          path: llama-sycl-vulkan-windows-x64.zip
          name: llama-sycl-vulkan-windows-x64.zip

  sycl-vulkan-ubuntu:
    if: github.event_name != 'schedule' && inputs.touch-only != true
