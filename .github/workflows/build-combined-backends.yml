          name: llama-sycl-vulkan-ubuntu-x64.zip

  # ============================================================
  #  Publish all built archives to Alibaba Cloud OSS
  #  (always runs; HIP/SYCL failures are continue-on-error)
  # ============================================================
  publish-oss:
    runs-on: ubuntu-22.04
    needs:
      - cuda-vulkan-windows
      - cuda-vulkan-ubuntu
      - hip-vulkan-windows
      - hip-vulkan-ubuntu
      - sycl-vulkan-windows
      - sycl-vulkan-ubuntu
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute version strings
        shell: bash
        run: |
          echo "BUILD_DATE=$(date -u +%Y%m%d)"     >> $GITHUB_ENV
          echo "COMMIT_ID=${GITHUB_SHA:0:8}"       >> $GITHUB_ENV

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: ./artifact
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la artifact/ || true

      - name: Install ossutil
        run: |
          curl -o ossutil64 "https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64"
          chmod +x ossutil64
          ./ossutil64 version || true

      - name: Upload to OSS
        env:
          OSS_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_KEY: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          set -e
          cd artifact
          shopt -s nullglob
          files=( *.zip )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No archives to upload"; exit 0
          fi
          built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for f in "${files[@]}"; do
            echo "== $f =="
            sha256=$(sha256sum "$f" | awk '{print $1}')
            size=$(stat -c %s "$f")
            echo "sha256=$sha256"
            # sidecar manifest for the istation downloader (same name + .manifest)
            printf '{\n  "artifact_sha256": "%s",\n  "artifact_size_bytes": %s,\n  "built_at": "%s",\n  "version": "%s"\n}\n' \
              "$sha256" "$size" "$built_at" "${BUILD_DATE}-${COMMIT_ID}" > "$f.manifest"
            cat "$f.manifest"
            ./../ossutil64 cp "$f" "oss://${{ env.OSS_BUCKET }}/${{ env.OSS_PREFIX }}/${{ env.BUILD_DATE }}-${{ env.COMMIT_ID }}/$f" \
              -i "$OSS_ID" -k "$OSS_KEY" -e "${{ env.OSS_ENDPOINT }}" -f \
              --meta "x-oss-meta-sha256:$sha256"
            ./../ossutil64 cp "$f.manifest" "oss://${{ env.OSS_BUCKET }}/${{ env.OSS_PREFIX }}/${{ env.BUILD_DATE }}-${{ env.COMMIT_ID }}/$f.manifest" \
              -i "$OSS_ID" -k "$OSS_KEY" -e "${{ env.OSS_ENDPOINT }}" -f
          done

  # ============================================================
  #  Publish all built archives to Hugging Face datasets
  #  (parallel to OSS; HF failure does not block OSS / ModelScope)
  #  Target: datasets/cunba-ai/istation, path llama.cpp/{date}-{commit}
    # ============================================================
  publish-hf:
    runs-on: ubuntu-22.04
    needs:
      - cuda-vulkan-windows
      - cuda-vulkan-ubuntu
      - hip-vulkan-windows
      - hip-vulkan-ubuntu
      - sycl-vulkan-windows
      - sycl-vulkan-ubuntu
    env:
      HF_REPO_ID: "cunba-ai/istation"
      HF_FOLDER_IN_REPO: "llama.cpp"
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute version strings
        shell: bash
        run: |
          echo "BUILD_DATE=$(date -u +%Y%m%d)"     >> $GITHUB_ENV
          echo "COMMIT_ID=${GITHUB_SHA:0:8}"       >> $GITHUB_ENV

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: ./artifact
          merge-multiple: true

      - name: Stage upload tree
        # huggingface_hub uploads folder_path as-is, so build the in-repo layout
        # locally: upload_root/llama.cpp/{date}-{commit}/*.archive
        # (发布布局 v2: latest/ 目录退役, 只传版本目录)
        run: |
          set -e
          shopt -s nullglob
          mkdir -p "upload_root/${{ env.HF_FOLDER_IN_REPO }}/${{ env.BUILD_DATE }}-${{ env.COMMIT_ID }}"
          files=( artifact/*.zip )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No archives to upload"; exit 0
          fi
          for f in "${files[@]}"; do
            cp "$f" "upload_root/${{ env.HF_FOLDER_IN_REPO }}/${{ env.BUILD_DATE }}-${{ env.COMMIT_ID }}/"
          done
          find upload_root -type f | sort

      - name: Install huggingface_hub
        run: pip install -U "huggingface_hub[cli]"

      - name: Upload to Hugging Face dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo_id = os.environ["HF_REPO_ID"]
          folder_in_repo = os.environ["HF_FOLDER_IN_REPO"]
          for sub in [os.environ["BUILD_DATE"] + "-" + os.environ["COMMIT_ID"]]:
              api.upload_folder(
                  repo_id=repo_id,
                  repo_type="dataset",
                  folder_path=f"upload_root/{folder_in_repo}/{sub}",
                  path_in_repo=f"{folder_in_repo}/{sub}",
                  commit_message=f"Upload llama.cpp {sub}",
              )
              print(f"uploaded -> {folder_in_repo}/{sub}")
          PY

  # ============================================================
  #  Publish all built archives to ModelScope datasets
  #  (parallel to OSS / HF; ModelScope failure does not block them)
  #  Target: datasets/cunbaai/istation, path llama.cpp/{date}-{commit}
    # ============================================================
  publish-modelscope:
    runs-on: ubuntu-22.04
    needs:
      - cuda-vulkan-windows
      - cuda-vulkan-ubuntu
      - hip-vulkan-windows
      - hip-vulkan-ubuntu
      - sycl-vulkan-windows
      - sycl-vulkan-ubuntu
    env:
      MS_REPO_ID: "cunbaai/istation"
      MS_FOLDER_IN_REPO: "llama.cpp"
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute version strings
        shell: bash
        run: |
          echo "BUILD_DATE=$(date -u +%Y%m%d)"     >> $GITHUB_ENV
          echo "COMMIT_ID=${GITHUB_SHA:0:8}"       >> $GITHUB_ENV

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: ./artifact
          merge-multiple: true

      - name: Stage upload tree
        run: |
          set -e
          shopt -s nullglob
          mkdir -p "upload_root/${{ env.MS_FOLDER_IN_REPO }}/${{ env.BUILD_DATE }}-${{ env.COMMIT_ID }}"
          files=( artifact/*.zip )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No archives to upload"; exit 0
          fi
          for f in "${files[@]}"; do
            cp "$f" "upload_root/${{ env.MS_FOLDER_IN_REPO }}/${{ env.BUILD_DATE }}-${{ env.COMMIT_ID }}/"
          done
          find upload_root -type f | sort

      - name: Install modelscope
        run: pip install -U modelscope

      - name: Upload to ModelScope dataset
        env:
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_API_TOKEN }}
        run: |
          set -e
          python - <<'PY'
          import os
          from modelscope.hub.api import HubApi
          api = HubApi(token=os.environ["MODELSCOPE_API_TOKEN"])
          repo_id = os.environ["MS_REPO_ID"]
          folder_in_repo = os.environ["MS_FOLDER_IN_REPO"]
          for sub in [os.environ["BUILD_DATE"] + "-" + os.environ["COMMIT_ID"]]:
              api.upload_folder(
                  repo_id=repo_id,
                  repo_type="dataset",
                  folder_path=f"upload_root/{folder_in_repo}/{sub}",
                  path_in_repo=f"{folder_in_repo}/{sub}",
                  commit_message=f"Upload llama.cpp {sub}",
              )
              print(f"uploaded -> {folder_in_repo}/{sub}")
          PY
