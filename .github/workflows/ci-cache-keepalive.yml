name: CI cache keepalive

# GitHub Actions caches are evicted after 7 days without access, but
# build-combined-backends only runs every 2-4 weeks - so every run started
# cold (measured 0% ccache hits across all legs, run 41406693204). This
# workflow restores each cache weekly to reset the eviction timer.
#
# Restoring (downloading) a cache counts as access; that is the whole point.
# ~5GB downloaded on a free runner, ~5min. Missing keys are not an error -
# actions/cache/restore just logs "not found", so this is a no-op until the
# build workflow has created the caches once.
#
# Every step has continue-on-error so one flaky download cannot abort the
# remaining refreshes - an untouched cache would expire 7 days later.
#
# The ccache-* restores use restore-keys prefixes because ccache-action
# appends a timestamp to every saved key; the prefix matches the newest
# entry, which is also the one the next build run restores.

on:
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  touch-caches:
    runs-on: ubuntu-latest
    steps:
      - name: ccache combined-windows-2022-cuda-12.9
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: cache-touch
          key: keepalive-${{ github.run_id }}
          restore-keys: ccache-combined-windows-2022-cuda-12.9-

      - name: ccache combined-ubuntu-22.04-cuda-12.9
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: cache-touch
          key: keepalive-${{ github.run_id }}
          restore-keys: ccache-combined-ubuntu-22.04-cuda-12.9-

      - name: ccache combined-windows-2022-hip
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: cache-touch
          key: keepalive-${{ github.run_id }}
          restore-keys: ccache-combined-windows-2022-hip-

      - name: ccache combined-ubuntu-22.04-hip
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: cache-touch
          key: keepalive-${{ github.run_id }}
          restore-keys: ccache-combined-ubuntu-22.04-hip-

      - name: ccache combined-windows-2022-sycl
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: cache-touch
          key: keepalive-${{ github.run_id }}
          restore-keys: ccache-combined-windows-2022-sycl-

      - name: ccache combined-ubuntu-24.04-sycl
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: cache-touch
          key: keepalive-${{ github.run_id }}
          restore-keys: ccache-combined-ubuntu-24.04-sycl-

      - name: vulkan-sdk
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: cache-touch
          key: vulkan-sdk-1.4.313.2-v1

      - name: cuda-toolkit
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: cache-touch
          key: cuda-toolkit-12.9.0-windows-v1

      - name: PROBE linux-exact-key (cross-workflow visibility)
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: probe
          key: ccache-combined-ubuntu-22.04-cuda-12.9-2026-11-02T09:36:33.410Z

      - name: PROBE win-exact-key crossos
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: probe
          key: ccache-combined-windows-2022-cuda-12.9-2026-11-02T09:44:24.669Z
          enableCrossOsArchive: true

      - name: PROBE self save+restore control
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: .github
          key: keepalive-selftest-v1
